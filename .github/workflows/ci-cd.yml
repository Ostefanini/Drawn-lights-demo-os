name: CI/CD (push main)

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ostefanini
  REPO: drawn-lights-game
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Create .env.dev.local from example
        run: cp .env.test.example .env.dev.local

      - run: pnpm -v
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Build packages
        run: |
          pnpm -C packages/shared build
          pnpm -C packages/prisma build

      - name: Re-inject workspace packages
        run: pnpm install --frozen-lockfile

      - run: node -v
      - run: pnpm --filter web-react exec eslint -v

      - name: Lint (workspace)
        run: pnpm lint

      - name: Type check (workspace)
        run: pnpm typecheck

      - name: Unit tests (all apps)
        run: pnpm -r --filter './apps/*' test:unit

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drawn_lights_game_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user -d drawn_lights_game_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - run: pnpm -v
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Build packages
        run: |
          pnpm -C packages/shared build
          pnpm -C packages/prisma build

      - name: Re-inject workspace packages
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Prisma generate
        run: pnpm --filter @drawn-lights-game/prisma exec prisma generate --config prisma.config.ts
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Prisma migrate
        run: pnpm --filter @drawn-lights-game/prisma exec prisma migrate deploy --config prisma.config.ts
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Integration tests (api-nestjs)
        run: pnpm --filter api-nestjs test:integration
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Integration coverage badges
        run: pnpm exec jest --config ./test/jest-e2e.json --coverage --coverageDirectory=./coverage --runInBand && npx jest-coverage-badges --output ./badges
        working-directory: apps/api-nestjs
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Unit coverage badges (api-expressjs)
        run: pnpm exec jest --coverage && npx jest-coverage-badges --output ./badges
        working-directory: apps/api-expressjs
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          NODE_ENV: test
          FORCE_SECRET_COMBINATION: TRIANGLE,SQUARE,CIRCLE,NULL,GLOSSY
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Commit coverage badges
        uses: EndBug/add-and-commit@v9
        with:
          add: "apps/*/badges/*"
          message: "chore: update coverage badges [skip ci]"
          default_author: github_actions
          new_branch: badges
          push: origin badges --force
        continue-on-error: true

  e2e-playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Create .env.test from example
        run: cp .env.test.example .env.test

      - run: pnpm -v
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Start E2E Playwright test stack
        run: pnpm run stack:tests:e2e

      - name: Wait for E2E stack to be ready
        run: |
          for i in {1..90}; do
            if curl -f http://localhost:3004/apis/ping > /dev/null 2>&1; then
              echo "✅ Stack is ready (frontend responding)"
              exit 0
            fi
            echo "⏳ Waiting for stack... ($i/90)"
            sleep 2
          done
          echo "❌ Stack failed to start"
          exit 1

      - name: Install Playwright Browsers (chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E Playwright tests
        run: pnpm run test:e2e-playwright

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop E2E Playwright test stack
        if: ${{ always() }}
        run: pnpm run stack:tests:e2e:down
        continue-on-error: true

  e2e-gherkin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Create .env.test from example
        run: cp .env.test.example .env.test

      - run: pnpm -v
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Start E2E Gherkin test stack
        run: pnpm run stack:tests:e2e

      - name: Wait for E2E stack to be ready
        run: |
          for i in {1..90}; do
            if curl -f http://localhost:3004/apis/ping > /dev/null 2>&1; then
              echo "✅ Stack is ready (frontend responding)"
              exit 0
            fi
            echo "⏳ Waiting for stack... ($i/90)"
            sleep 2
          done
          echo "❌ Stack failed to start"
          exit 1

      - name: Install Playwright Browsers (chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E Gherkin tests
        run: pnpm run test:e2e-gherkin

      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: cucumber-report/
          retention-days: 30

      - name: Stop E2E Gherkin test stack
        if: ${{ always() }}
        run: pnpm run stack:tests:e2e:down
        continue-on-error: true

  build_and_push:
    needs:
      [unit-tests, integration-tests, e2e-playwright-tests, e2e-gherkin-tests]
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: web-react
            dockerfile: apps/web-react/Dockerfile
            context: .
            target: runtime
          - name: api-expressjs
            dockerfile: apps/api-expressjs/Dockerfile
            context: .
            target: runtime
          - name: api-nestjs
            dockerfile: apps/api-nestjs/Dockerfile
            context: .
            target: runtime
          - name: prisma-migrate
            dockerfile: packages/prisma/Dockerfile
            context: .
            target: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to DHI
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.PERSONAL_DOCKER_USERNAME }}
          password: ${{ secrets.PERSONAL_DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          build-args: |
            DATABASE_URL="postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}/${{ matrix.image.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy (SSH -> docker compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            docker image prune -f
