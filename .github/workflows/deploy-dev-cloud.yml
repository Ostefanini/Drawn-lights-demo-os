name: Deploy Dev Cloud (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ostefanini
  REPO: drawn-lights-game
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check if user is authorized
        if: github.actor != 'ostefanini' && github.actor != 'karinemajda'
        run: |
          echo "❌ Only ostefanini and karinemajda can trigger this workflow"
          exit 1
      - name: ✅ Authorization passed
        run: echo "User ostefanini is authorized"

  build_and_push:
    needs: authorize
    runs-on: ubuntu-latest
    environment: dev-cloud
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: web-react
            dockerfile: apps/web-react/Dockerfile
            context: .
            target: runtime
          - name: api-nestjs
            dockerfile: apps/api-nestjs/Dockerfile
            context: .
            target: runtime
          - name: prisma-migrate
            dockerfile: packages/prisma/Dockerfile
            context: .
            target: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to DHI
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.PERSONAL_DOCKER_USERNAME }}
          password: ${{ secrets.PERSONAL_DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.image.name }} with dev-cloud-latest tag
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}/${{ matrix.image.name }}:dev-cloud-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: dev-cloud
    steps:
      - name: Deploy dev-cloud stack (SSH -> docker compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd "game_dev"
            git pull
            /home/deploy/.nvm/versions/node/v20.18.3/bin/dotenv -e .env.dev.cloud -- docker compose -f docker-compose.dev.cloud.yml pull
            /home/deploy/.nvm/versions/node/v20.18.3/bin/dotenv -e .env.dev.cloud -- docker compose -f docker-compose.dev.cloud.yml up -d --force-recreate --remove-orphans
            docker image prune -f
