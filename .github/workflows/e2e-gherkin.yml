name: E2E Gherkin tests (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to test"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e-gherkin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Create .env.test from example
        run: cp .env.test.example .env.test

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/drawn_lights_game_test"

      - name: Start E2E Gherkin test stack
        run: pnpm run stack:tests:e2e

      - name: Wait for E2E stack to be ready
        run: |
          for i in {1..90}; do
            if curl -f http://localhost:3004/apis/ping > /dev/null 2>&1; then
              echo "✅ Stack is ready (frontend responding)"
              exit 0
            fi
            echo "⏳ Waiting for stack... ($i/90)"
            sleep 2
          done
          echo "❌ Stack failed to start"
          exit 1

      - name: Install Playwright Browsers (chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E Gherkin tests
        run: pnpm run test:e2e-gherkin

      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: cucumber-report/
          retention-days: 30

      - name: Stop E2E Gherkin test stack
        if: ${{ always() }}
        run: pnpm run stack:tests:e2e:down
        continue-on-error: true
