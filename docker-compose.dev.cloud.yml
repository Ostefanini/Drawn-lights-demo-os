name: drawn_lights_game-dev-cloud

services:
  migrate:
    image: ghcr.io/ostefanini/drawn-lights-game/prisma-migrate:dev-cloud-latest
    env_file:
      - .env.dev.cloud
    networks:
      - public
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/ostefanini/drawn-lights-game/web-react:dev-cloud-latest
    container_name: "dev_cloud_web"
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ./nginx.dev.cloud.generated.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "80"
    networks:
      public:
        aliases:
          - dev-game-web-react
    env_file:
      - .env.dev.cloud
    environment:
      - CERTS_DIR=${CERTS_DIR}
    depends_on:
      api:
        condition: service_started

  api:
    image: ghcr.io/ostefanini/drawn-lights-game/api-nestjs:dev-cloud-latest
    container_name: "dev_cloud_api"
    env_file:
      - .env.dev.cloud
    ports:
      - 127.0.0.1:4001:4000
    networks:
      - public
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    container_name: dev_cloud_postgres  
    env_file:
      - .env.dev.cloud
    networks:
      - public
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dev_cloud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: dev_cloud_pgweb
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "127.0.0.1:5051:8081"
    networks:
      - public
    depends_on:
      postgres:
        condition: service_healthy
  
volumes:
  dev_cloud_postgres_data:

networks:
  public:
    external: true