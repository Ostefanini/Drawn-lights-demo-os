name: drawn_lights_game-prod-local

services:
  migrate:
    build:
      context: .
      dockerfile: packages/prisma/Dockerfile
    env_file:
      - .env.prod.local
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: 
      context: .
      dockerfile: apps/web-react/Dockerfile
    # dockerfile: apps/web-nextjs/Dockerfile
    container_name: "local_prod_web"
    volumes:
      - ./certs:/certs:ro
      - ./nginx.prod.local.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 80:80
      - 443:443
    depends_on:
      api:
        condition: service_started

  api:
    build: 
      context: .
      #dockerfile: apps/api-expressjs/Dockerfile
      dockerfile: apps/api-nestjs/Dockerfile
    container_name: "local_prod_api"
    env_file:
      - .env.prod.local
    ports:
      - 127.0.0.1:4000:4000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    container_name: local_prod_postgres  
    env_file:
      - .env.prod.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: local_prod_pgweb
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "5051:8081"
    depends_on:
      postgres:
        condition: service_healthy
  
volumes:
  prod_postgres_data:

