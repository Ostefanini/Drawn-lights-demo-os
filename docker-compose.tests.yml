name: drawn_lights_game-test

services:
  migrate-test:
    build:
      context: .
      dockerfile: packages/prisma/Dockerfile
    env_file:
      - .env.test
    environment:
      # Override host for Docker network
      DATABASE_URL: "postgresql://test_user:test_password@postgres-test:5432/drawn_lights_game_test"
    networks:
      - test_network
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    image: postgres:16
    container_name: test_postgres
    environment:
      POSTGRES_DB: drawn_lights_game_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d drawn_lights_game_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      # Use tmpfs for faster tests (data is not persisted)
      - /var/lib/postgresql/data

  api-nestjs-test:
    build:
      context: .
      dockerfile: apps/api-nestjs/Dockerfile
    container_name: "api-nestjs-test"
    ports:
      - 4004:4000
    networks:
      - test_network
    env_file:
      - .env.test
    depends_on:
      postgres-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    profiles: ["e2e"]

  web-react-test:
    build:
      context: .
      dockerfile: apps/web-react/Dockerfile
    container_name: "web-react-test"
    volumes:
      - ./nginx.test.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 3004:80
    networks:
      - test_network
    depends_on:
      api-nestjs-test:
        condition: service_started
    profiles: ["e2e"]

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: test_pgweb
    command: --bind=0.0.0.0 --listen=8081
    environment:
      DATABASE_URL: "postgres://test_user:test_password@postgres-test:5432/drawn_lights_game_test?sslmode=disable"
    ports:
      - "5052:8081"
    networks:
      - test_network
    depends_on:
      postgres-test:
        condition: service_healthy
    profiles: ["e2e"]

networks:
  test_network:
    name: drawn_lights_game_test
